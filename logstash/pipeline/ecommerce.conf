input {
  beats {
    port => 5044
  }
}

filter {
  # 1. Chaque ligne est un objet JSON produit par le simulateur
  json {
    source => "message"
    skip_on_invalid_json => false
  }

  # 2. Le timestamp applicatif devient le @timestamp de l'événement
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # 3. Géolocalisation de l'IP client
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
      fields => ["city_name", "country_name", "country_code2", "location"]
    }
  }

  # 4. Analyse du User-Agent (navigateur, OS, device)
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }

  # 5. Enrichissements métier
  if [response_time_ms] and [response_time_ms] > 1000 {
    mutate { add_tag => ["slow_request"] }
  }
  if [status_code] and [status_code] >= 500 {
    mutate { add_tag => ["server_error"] }
  }

  # 6. Nettoyage des métadonnées Filebeat inutiles
  mutate {
    remove_field => ["agent", "ecs", "input", "host", "@version"]
    remove_tag => ["beats_input_codec_plain_applied"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ecommerce-logs-%{+YYYY.MM.dd}"
  }
  # Décommenter pour déboguer le pipeline :
  # stdout { codec => rubydebug }
}
